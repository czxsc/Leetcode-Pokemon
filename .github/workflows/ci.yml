# Checks every pull request and push; deploys main to AWS once the checks pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: Web app and API
    runs-on: ubuntu-latest
    services:
      # stand-ins for the cloud's databases, for the stores' integration tests
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ['8000:8000']
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-retries 15
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
      POSTGRES_URL: postgres://postgres:local@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  infra:
    name: Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: infra
      - run: npx tsc -p .
        working-directory: infra
      - run: npm test
        working-directory: infra
      # a real synth also bundles the Lambdas and packages the built app
      - run: npm run build
      - run: npx cdk synth --quiet
        working-directory: infra

  deploy:
    name: Deploy to AWS
    needs: [app, infra]
    # only for pushes to main, in a repo that has set up the deploy role (see docs/deploying.md)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # to sign in to AWS with GitHub's OIDC token, no stored keys
    concurrency: deploy-${{ vars.STAGE || 'dev' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - run: npm ci
        working-directory: infra
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: >
          npx cdk deploy "Pokeleet-${{ vars.STAGE || 'dev' }}"
          --require-approval never
          -c stage=${{ vars.STAGE || 'dev' }}
          -c budgetEmail=${{ secrets.BUDGET_EMAIL }}
          -c googleClientId=${{ vars.GOOGLE_CLIENT_ID }}
          -c domain=${{ vars.DOMAIN }}
        working-directory: infra
