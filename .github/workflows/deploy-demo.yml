# Publishes the online demo (npm run build:demo) to GitHub Pages on every
# push to main. One-time setup: Settings -> Pages -> Source: GitHub Actions.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - run: npm run build:demo
        env:
          # e.g. /Leetcode-Pokemon/ for https://<user>.github.io/Leetcode-Pokemon/
          POKELEET_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
