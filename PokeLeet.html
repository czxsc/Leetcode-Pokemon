<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokéLeet — Gamified LeetCode Tracker</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <div id="screen-wrap">
    <div id="screen" data-screen-label="App">
      <div class="scene-bg"></div>
      <div id="app" style="position:absolute; inset:0;"></div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Sequential, retrying loader: the in-browser Babel auto-loader drops
       files under concurrency on this dev server, so we fetch + transform +
       run each module in order with retries. -->
  <script>
  (async function(){
    const FILES = [
      'js/dex.jsx','js/pixelmon.jsx','js/data.jsx','js/store.jsx','js/ui.jsx',
      'js/detail.jsx','js/dashboard.jsx','js/gacha.jsx','js/quests.jsx','js/recall.jsx',
      'js/team.jsx','js/pokedex.jsx','js/shop.jsx','js/meadow.jsx','js/app.jsx'
    ];
    async function grab(f){
      for(let attempt=0; attempt<5; attempt++){
        try{
          const r = await fetch(f + (f.indexOf('?')<0?'?b=':'&b=') + attempt, { cache:'no-store' });
          if(r.ok) return await r.text();
        }catch(e){}
        await new Promise(res=>setTimeout(res, 180*(attempt+1)));
      }
      throw new Error('Could not load '+f+' after retries');
    }
    for(const f of FILES){
      let src;
      try{ src = await grab(f); }
      catch(err){ console.error(err.message); continue; }
      try{
        const out = Babel.transform(src, { presets:['react'], filename:f }).code;
        (0, eval)(out);
      }catch(err){ console.error('Error executing '+f+': '+(err && err.message), err); }
    }
  })();
  </script>
</body>
</html>
